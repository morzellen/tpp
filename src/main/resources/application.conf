tpp {
  server {
    host = "0.0.0.0"
    port = 8080
  }

  database {
    url = "jdbc:postgresql://localhost:5432/tpp"
    user = "tpp_user"
    password = "tpp_password"
    poolSize = 10
  }

  kafka {
    bootstrapServers = "localhost:9092"
    groupId = "tpp-consumer-group"
  }

  logging {
    level = "INFO"
    format = "json"
  }
}
